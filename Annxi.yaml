# --- 锚点定义 (通用属性) ---
proxy_providers_common:
  &p {
    type: http,
    interval: 86400,
    proxy: DIRECT,
    exclude-type: 'DIRECT|REJECT|REMATCH',
    health-check: { enable: true, url: https://www.apple.com/library/test/success.html, interval: 600, lazy: true },
  }

# 全局过滤节点
global_exclude_filter:
  &g {
    exclude-filter: '(?i)(群|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|电报|频道|无法|说明|提示|访问|支持|教程|关注|更新|作者|加入|超时|收藏|优惠|福利|邀请|好友|失联|选择|剩余|公益|发布|DIZTNA|通路|登录|定时|渠道|牢记|永久|余额|阁下|本站|刷新|导航|建议|重置|以下|过滤|⚠️|@|t\.me\/\+|\bexpire\b|\bhttps?:\/\/|\.com|\btraffic\b)',
  }

#订阅提供者
proxy-providers:
  1:
    <<:  [*p, *g]
    url: ""
    path: ./proxy_providers/1.yaml
    override: { additional-prefix: "[1]" }

#基础全局设置
mixed-port: 7890
allow-lan: false
bind-address: '127.0.0.1'
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: off
keep-alive-idle: 600
keep-alive-interval: 60
external-controller: '127.0.0.1:9090'
external-ui: ui
external-ui-url: 'https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip'

profile:
  store-selected: true
  store-fake-ip: true

#国内外DNS定义
chinaDNS: &chinaDNS
  - "https://dns.alidns.com/dns-query#DIRECT"
  - "https://doh.pub/dns-query#DIRECT"
  - "https://doh.360.cn/dns-query#DIRECT"
foreignDNS: &foreignDNS
  - "https://cloudflare-dns.com/dns-query#默认"
  - "https://dns.google/dns-query#默认"
  - "https://unfiltered.adguard-dns.com/dns-query#默认"
defaultDNS: &defaultDNS
  - "tls://223.5.5.5#DIRECT"
  - "tls://119.29.29.29#DIRECT"
  - "https://1.12.12.12/dns-query#DIRECT"
  - "https://223.5.5.5/dns-query#DIRECT"
  - "https://120.53.53.53/dns-query#DIRECT"
proxyServerDNS: &proxyServerDNS
  - "tls://223.5.5.5#DIRECT"
  - "tls://119.29.29.29#DIRECT"
  - "https://1.12.12.12/dns-query#DIRECT"
  - "https://223.5.5.5/dns-query#DIRECT"
  - "https://120.53.53.53/dns-query#DIRECT"

   
#DNS配置
dns:
  enable: true
  ipv6: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  use-hosts: true
  use-system-hosts: false
  Fake-ip-range: 198.18.0.1/15
  fake-ip-range6: fc00::1/64
  fake-ip-filter:
    - 'rule-set:private'
    - 'rule-set:fakeip_filter'
    - 'rule-set:cn'
    - 'rule-set:fcm'
  default-nameserver: *defaultDNS
  proxy-server-nameserver: *proxyServerDNS
  nameserver: *foreignDNS
  nameserver-policy:
    'rule-set:private': 'system'
    'rule-set:douyin': ['180.184.1.1', '180.184.2.2']
    'rule-set:cn': *chinaDNS
  direct-nameserver: *chinaDNS
  direct-nameserver-follow-policy: true

    
hosts:
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'cloudflare-dns.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']

  # 解决谷歌商店无法下载的问题
  'services.googleapis.cn': 'services.googleapis.com'
  
ntp:
  enable: true
  write-to-system: false
  server: 'ntp.aliyun.com'
  port: 123
  interval: 60
  
#TUN模式设置
tun:
  enable: true
  stack: mips
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
    
#直连
proxies: 
  - { name: '🇨🇳 直连 | 双栈', type: direct }
  - { name: '🇨🇳 直连 | IPv4优先', type: direct, ip-version: ipv4-prefer }
  - { name: '🇨🇳 直连 | IPv6优先', type: direct, ip-version: ipv6-prefer }
  - { name: '🇨🇳 直连 | 仅IPv4', type: direct, ip-version: ipv4 }
  - { name: '🇨🇳 直连 | 仅IPv6', type: direct, ip-version: ipv6 }
  
# 策略组通用配置
group_common:
  group_common_select:
    &group_common_select {
      type: select,
    }

proxies_reject: &proxies_reject { proxies: ['REJECT', 'REJECT-DROP', 'PASS'] }

# 地区过滤器正则表达式定义
group_filter:
  HK_filter: &HK_filter { filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\\s*kong)' }
  JP_filter: &JP_filter { filter: '(?i)(🇯🇵|日本|东京|大阪|京都|(?<![A-Za-z])JPN?(?![A-Za-z])|japan)' }
  TW_filter: &TW_filter { filter: '(?i)(🇹🇼|台湾|台北|高雄|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan)' }
  SG_filter: &SG_filter { filter: '(?i)(🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore)' }
  US_filter: &US_filter { filter: '(?i)(🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\\s*states)' }
  Other_filter: &Other_filter { exclude-filter: '(?i)(🇭🇰|香港|(?<![A-Za-z])HKG?(?![A-Za-z])|hong\s*kong|🇯🇵|日本|东京|大阪|京都|(?<![A-Za-z])JPN?(?![A-Za-z])|japan|🇺🇸|美国|纽约|洛杉矶|旧金山|芝加哥|休斯顿|迈阿密|西雅图|波士顿|华盛顿|拉斯维加斯|圣何塞|圣地亚哥|(?<![A-Za-z])USA?(?![A-Za-z])|america|united\s*states|🇸🇬|新加坡|狮城|(?<![A-Za-z])SGP?(?![A-Za-z])|singapore|🇹🇼|台湾|台北|高雄|(?<![A-Za-z])TWN?(?![A-Za-z])|taiwan)' }

# 通用代理节点组
proxies_common:
  proxies_default:
    &proxies_default {
      proxies:
        [
          '𝙋𝙍𝙓',
          '𝙃𝙆𝙂',
          '𝙏𝙒𝙉',
          '𝙅𝙋𝙉',
          '𝙎𝙂𝙋',
          '𝙐𝙎𝘼',
          '𝙊𝙏𝙃',
          '𝙎𝙀𝙇',
        ],
    }

  proxies_direct:
    &proxies_direct {
      proxies:
        [
          '𝙋𝙍𝙓',
          '𝙃𝙆𝙂',
          '𝙏𝙒𝙉',
          '𝙅𝙋𝙉',
          '𝙎𝙂𝙋',
          '𝙐𝙎𝘼',
          '𝙊𝙏𝙃',
          '𝙎𝙀𝙇',
          '𝘾𝙃𝙉',
        ],
    }

  proxies_reject: &proxies_reject { proxies: ['REJECT', 'REJECT-DROP', 'PASS'] }

# 定义分流策略组
proxy-groups:
  - name: '𝙋𝙍𝙓'
    <<: *group_common_select
    proxies:
      [
        '𝙃𝙆𝙂',
        '𝙏𝙒𝙉',
        '𝙅𝙋𝙉',
        '𝙎𝙂𝙋',
        '𝙐𝙎𝘼',
        '𝙊𝙏𝙃',
        '𝙎𝙀𝙇',
      ]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Proxy.svg'

  - name: '𝙂𝙂𝙇'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Google.svg'

  - name: '𝘼𝙄𝙉'
    default-selected: '𝙐𝙎𝘼'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/OpenAI.svg'

  - name: '𝙏𝙒𝙏'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Twitter.svg'

  - name: '𝙏𝙂𝙉'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Telegram.svg'

  - name: '𝙈𝙀𝙏'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Meta.svg'

  - name: '𝙔𝙏𝘽'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/YouTube.svg'

  - name: '𝙏𝙏𝙆'
    default-selected: '𝙅𝙋𝙉'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/TikTok.svg'

  - name: '𝙀𝙈𝘽'
    <<: [*group_common_select, *proxies_direct]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Emby.svg'

  - name: '𝙀𝙃𝙏'
    default-selected: '𝙐𝙎𝘼'
    <<: [*group_common_select, *proxies_default]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/EHentai.svg'

  - name: '𝙁𝘾𝙈'
    <<: *group_common_select
    proxies: ['𝘾𝙃𝙉']
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Fcm.svg'

  - name: '𝘼𝘽𝙇'
    <<: [*group_common_select, *proxies_reject]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/AdBlock.svg'

  - name: '𝘾𝙃𝙉'
    <<: *group_common_select
    proxies:
      [
        '🇨🇳 直连 | 双栈',
        '🇨🇳 直连 | IPv4优先',
        '🇨🇳 直连 | IPv6优先',
        '🇨🇳 直连 | 仅IPv4',
        '🇨🇳 直连 | 仅IPv6',
      ]
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/China.svg'

  # 定义地区策略组
  - name: '𝙃𝙆𝙂'
    <<: [*group_common_select, *HK_filter]
    include-all: true
    exclude-type: 'DIRECT'
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/HongKong.svg'

  - name: '𝙏𝙒𝙉'
    <<: [*group_common_select, *TW_filter]
    include-all: true
