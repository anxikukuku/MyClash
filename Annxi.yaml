  - name: '𝙎𝙀𝙇'
    <<: *group_common_select
    include-all: true
    exclude-type: 'DIRECT'
    icon: 'https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Static.svg'

#分流规则
rules:
  # 规则集下载域名，避免出现鸡蛋问题
  - DOMAIN,cdn.jsdmirror.com,𝘾𝙃𝙉
  #基础局域网与系统服务
  - RULE-SET,private,DIRECT
  # 国内域名直连
  - RULE-SET,geolocation-cn,𝘾𝙃𝙉
  - DOMAIN-SUFFIX,ctaiot.com,𝘾𝙃𝙉
  # 去广告
  - RULE-SET,category-ads,𝘼𝘽𝙇
  # FCM推送
  - RULE-SET,fcm,𝙁𝘾𝙈
  # 油管
  - RULE-SET,youtube,𝙔𝙏𝘽
  # AI
  - RULE-SET,ai,𝘼𝙄𝙉
  - DOMAIN,cdn.usefathom.com,𝘼𝙄𝙉
  - DOMAIN-SUFFIX,intercom.io,𝘼𝙄𝙉
  - DOMAIN-SUFFIX,intercomcdn.com,𝘼𝙄𝙉
  # Google
  - RULE-SET,google,𝙂𝙂𝙇
  # 视频服务
  - RULE-SET,tiktok,𝙏𝙏𝙆
  # 社交媒体
  - RULE-SET,telegram,𝙏𝙂𝙉
  - RULE-SET,twitter,𝙏𝙒𝙏
  - RULE-SET,instagram,𝙈𝙀𝙏
  - RULE-SET,meta,𝙈𝙀𝙏
  # emby
  - RULE-SET,emby,𝙀𝙈𝘽
  - RULE-SET,emos,𝙀𝙈𝘽
  - DOMAIN-SUFFIX,mb3admin.com,𝙀𝙈𝘽
  - DOMAIN-SUFFIX,nubebelle.com,𝙀𝙈𝘽
  - DOMAIN-KEYWORD,emby,𝙀𝙈𝘽
  - PROCESS-NAME,com.mb.android,𝙀𝙈𝘽
  - PROCESS-NAME,tv.emby.embyatv,𝙀𝙈𝘽
  - PROCESS-NAME,com.hush.yamby,𝙀𝙈𝘽
  - PROCESS-NAME,com.jellycine.app,𝙀𝙈𝘽
  - PROCESS-NAME,com.mountains.hills,𝙀𝙈𝘽
  - PROCESS-NAME,RodelPlayer.App.exe,𝙀𝙈𝘽
  - PROCESS-NAME,com.feifeiduck.capyplayer,𝙀𝙈𝘽
  # Ehentai
  - RULE-SET,ehentai,𝙀𝙃𝙏
  # 国外域名兜底（漏网之鱼）
  - RULE-SET,geolocation-!cn,𝙋𝙍𝙓
  # 国外IP地址分流
  - RULE-SET,google_ip,𝙂𝙂𝙇
  - RULE-SET,tiktok_ip,𝙏𝙏𝙆
  - RULE-SET,telegram_ip,𝙏𝙂𝙉
  - RULE-SET,twitter_ip,𝙏𝙒𝙏
  # 国内IP地址分流
  - RULE-SET,cn_ip,𝘾𝙃𝙉
  - RULE-SET,private_ip,𝘾𝙃𝙉
  # 最终真·兜底
  - MATCH,𝙋𝙍𝙓

